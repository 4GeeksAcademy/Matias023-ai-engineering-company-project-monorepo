services:
  # ──────────────────────────────────────────────
  # Frontend: public website (port 3000)
  # ──────────────────────────────────────────────
  interfaces:
    build:
      context: .
      dockerfile: uis/Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis/website:/app/website
      - ./uis/backoffice:/app/backoffice
      - /app/website/node_modules
      - /app/backoffice/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - trackflow
    depends_on:
      - backend

  # ──────────────────────────────────────────────
  # Backend: FastAPI (port 8000)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app/services/api
      - ./packages/shared:/app/packages/shared
      - ./data/raw:/app/data/raw
      - ./data/pipelines:/app/data/pipelines
      - telemetry-db:/app/services/api/data/async-db
      - /app/services/api/.venv
    env_file:
      - path: ./services/api/.env
        required: false
    environment:
      - FRONTEND_URL=http://localhost:3001
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_FALLBACK_URL=sqlite:////app/services/api/data/async-db/telemetry.db
    networks:
      - trackflow
    depends_on:
      - redis
      - qdrant

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - trackflow

  celery-worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["/app/services/api/.venv/bin/celery", "-A", "celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=celery,dead_letter"]
    volumes:
      - ./services/api:/app/services/api
      - ./packages/shared:/app/packages/shared
      - ./data/raw:/app/data/raw
      - ./data/pipelines:/app/data/pipelines
      - telemetry-db:/app/services/api/data/async-db
      - /app/services/api/.venv
    env_file:
      - path: ./services/api/.env
        required: false
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_FALLBACK_URL=sqlite:////app/services/api/data/async-db/telemetry.db
    depends_on:
      - redis
    networks:
      - trackflow

  flower:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["/app/services/api/.venv/bin/celery", "-A", "celery_app:celery_app", "flower", "--address=0.0.0.0", "--port=5555"]
    ports:
      - "5555:5555"
    volumes:
      - ./services/api:/app/services/api
      - ./packages/shared:/app/packages/shared
      - /app/services/api/.venv
    env_file:
      - path: ./services/api/.env
        required: false
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    networks:
      - trackflow

  # Qdrant: base vectorial de TrackFlow (desarrollo)
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - trackflow

networks:
  trackflow:
    name: trackflow
    driver: bridge

volumes:
  telemetry-db:
  qdrant-data:
