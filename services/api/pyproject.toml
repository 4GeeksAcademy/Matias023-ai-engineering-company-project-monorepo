[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "libpass[bcrypt]>=1.9.3",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.0",
    "python-jose[cryptography]>=3.5.0",
    "resend>=2.42.0",
    "sqlmodel>=0.0.24",
    "tinydb>=4.9.0",
    "trackflow-shared",
]

[project.scripts]
seed = "seed:main"
seed-inventory = "seed_inventory:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "models", "database", "security", "seed", "email_service", "error_handlers", "inventory_models", "schemas", "seed_inventory"]
packages = ["routers"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
trackflow-shared = { path = "../../packages/shared", editable = true }
